services:
  app:
    build: .
    container_name: sample_project
    ports:
      - "${HTTP_PORT:-80}:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data        # certificados: sin esto se pierden al recrear el contenedor
      - caddy_config:/config
    restart: unless-stopped
  
volumes:
  caddy_data:
  caddy_config: