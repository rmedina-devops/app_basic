name: Test and Deploy to APP

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      
      - name: Set up Repo
        uses: actions/checkout@v7
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      
      - name: Cache composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
           ${{ runner.os }}-php-
      
      - name: Installa dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      
      - name: Create .env
        run: cp .env.example .env
        
      - name: Start up FrankenPHP
        run: docker compose up --build -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
              if curl -ksf https://localhost/login > /dev/null; then
                echo "App ready"; exit 0
              fi
              sleep 2
            done
            echo "App did not start"
            docker compose logs
            exit 1
      
      - name: Run test suite
        run: composer test

      - name: Stop app
        if: always()
        run: docker compose down