name: Test and Deploy to APP

on:
  push:
    branches:
      - main
    tags: 
      - v*
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: setup
    steps:
      
      - name: Set up Repo
        uses: actions/checkout@v7
      
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      
      - name: Cache composer packages
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}
          restore-keys: |
           ${{ runner.os }}-php-
      
      - name: Installa dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
      
      - name: Create .env
        run: cp .env.example .env

      - name: Start up FrankenPHP
        run: docker compose -f compose.yml up --build -d

      - name: Wait for app
        run: |
          for i in $(seq 1 30); do
            code=$(curl -ks -o /dev/null -w "%{http_code}" https://localhost/login || true)
            echo "Intento $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "App ready"; exit 0
            fi
            sleep 2
          done
          echo "App did not start"
          curl -ksv https://localhost/login || true
          docker compose ps
          docker compose logs
          echo "--- BODY ---"
          curl -ks https://localhost/login || true
          echo "--- VENDOR / .ENV ---"
          docker compose exec -T app sh -c 'pwd; ls -la; ls vendor | head -5; ls -la .env' || true
          docker compose -f compose.yml ps
          docker compose -f compose.yml logs --tail=40
          exit 1
      
      - name: Run test suite
        run: composer test

      - name: Stop app
        if: always()
        run: docker compose -f compose.yml down
  
  build:
    name: Build
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      
      - name: Set up Repo
        uses: actions/checkout@v7

      - name: Image name of Docker
        id: image
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$DOCKER_USER" ]; then
            echo "Falta la variable DOCKER_USERNAME (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi
          REF="${DOCKER_USER,,}/${REPO_NAME,,}:${TAG_NAME#v}"
          echo "Imagen: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Get tag
        env:
          REF_TYPE: ${{github.ref_type}}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "Tipo de referencia : $REF_TYPE"
          echo "Nombre : $REF_NAME"
          echo "Versión sin la v : ${REF_NAME#v}"
      
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.image.outputs.ref }}